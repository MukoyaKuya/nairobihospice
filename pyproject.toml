[project]
name = "nairobi-hospice-pcms"
version = "1.0.0"
description = "Nairobi Hospice Palliative Care Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.15,<5.3",
    "djangorestframework>=3.15.0",
    "django-filter>=24.0",
    "django-htmx>=1.18.0",
    "django-cors-headers>=4.3.0",
    "drf-spectacular>=0.27.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pillow>=10.3.0",
    "psycopg[binary]>=3.1.0",
    "mysqlclient>=2.2.4",
    "python-dotenv>=1.2.2",
    "pyodbc>=5.3.0",
    "django-daisy>=2.0.11",
    "reportlab>=5.0.1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*", "api*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "**/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["F403", "F405", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db -v"
