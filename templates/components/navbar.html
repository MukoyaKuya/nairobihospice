{% load static %}
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            
            <!-- Left: Mobile Menu Toggle & Official Logo -->
            <div class="flex items-center space-x-1.5 sm:space-x-3">
                <button type="button" 
                        @click="sidebarOpen = !sidebarOpen; $nextTick(() => { if (window.lucide) { lucide.createIcons(); } });" 
                        class="lg:hidden p-2 rounded-xl text-slate-700 hover:text-[#002D62] hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-[#002D62] transition cursor-pointer"
                        aria-label="Toggle Navigation Menu">
                    <span x-show="!sidebarOpen" class="flex items-center">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </span>
                    <span x-show="sidebarOpen" class="flex items-center" style="display: none;">
                        <i data-lucide="x" class="w-6 h-6 text-[#991B1B]"></i>
                    </span>
                </button>

                <a href="{% url 'reporting:clinical_dashboard' %}" class="flex items-center py-1 group">
                    <img src="{% static 'images/logo.png' %}" alt="Nairobi Hospice" class="h-11 sm:h-16 w-auto object-contain transition duration-150 transform group-hover:scale-[1.02]">
                </a>
            </div>



            <!-- Right: Notifications & User Avatar Profile -->
            <div class="flex items-center space-x-4">
                
                <!-- Notification Bell with Red Count Badge & Live Polling -->
                {% include 'components/notification_badge.html' %}

                <!-- User Profile Dropdown -->
                <div class="relative" x-data="{ userMenu: false }">
                    <button @click="userMenu = !userMenu" class="flex items-center space-x-2.5 p-1 rounded-xl hover:bg-slate-100 transition">
                        <div class="w-9 h-9 rounded-full bg-[#002D62] text-white font-bold text-xs flex items-center justify-center border-2 border-red-500 overflow-hidden shadow-sm">
                            {% if current_user.staff_profile.profile_picture %}
                            <img src="{{ current_user.staff_profile.profile_picture.url }}" alt="{{ current_user.display_name }}" class="w-full h-full object-cover">
                            {% else %}
                            <span>{{ current_user.first_name|first|default:"U" }}{{ current_user.last_name|first|default:"" }}</span>
                            {% endif %}
                        </div>
                        <div class="hidden sm:block text-left">
                            <span class="text-xs font-bold text-slate-900 block leading-tight">{{ current_user.display_name }}</span>
                            <span class="text-[10px] font-bold text-[#991B1B] block uppercase tracking-wide">{{ user_role_display|default:"Staff" }}</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 hidden sm:block"></i>
                    </button>

                    <div x-cloak x-show="userMenu" @click.away="userMenu = false" x-transition
                         class="origin-top-right absolute right-0 mt-2 w-56 rounded-2xl shadow-xl bg-white ring-1 ring-black ring-opacity-5 py-1 z-50 divide-y divide-slate-100">
                        <div class="px-4 py-3 bg-slate-50">
                            <p class="text-xs font-bold text-slate-900">{{ current_user.display_name }}</p>
                            <p class="text-[11px] text-slate-500 truncate font-mono">{{ current_user.email }}</p>
                        </div>
                        <div class="py-1">
                            <a href="{% url 'accounts:profile' %}" class="flex items-center px-4 py-2 text-xs text-slate-700 hover:bg-slate-50 font-medium">
                                <i data-lucide="user" class="w-4 h-4 mr-2.5 text-[#002D62]"></i> My Profile & Role
                            </a>
                            {% if current_user.is_staff or current_user.is_superuser %}
                            <a href="/admin/" target="_blank" class="flex items-center px-4 py-2 text-xs font-bold text-[#002D62] hover:bg-blue-50">
                                <i data-lucide="shield" class="w-4 h-4 mr-2.5 text-[#002D62]"></i> System Admin (/admin)
                            </a>
                            {% endif %}
                        </div>
                        <div class="py-1">
                            <a href="{% url 'accounts:logout' %}" class="flex items-center px-4 py-2 text-xs font-bold text-[#991B1B] hover:bg-red-50">
                                <i data-lucide="log-out" class="w-4 h-4 mr-2.5 text-[#991B1B]"></i> Sign Out
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</header>
