{% if messages %}
<div class="fixed top-5 right-5 z-50 max-w-sm sm:max-w-md w-[calc(100%-2.5rem)] space-y-2.5 pointer-events-none">
    {% for message in messages %}
    <div class="pointer-events-auto p-3.5 sm:p-4 rounded-2xl text-xs sm:text-sm font-medium flex items-center justify-between shadow-lg border backdrop-blur-md transition-all
        {% if message.tags == 'error' %}bg-rose-50/95 text-rose-900 border-rose-200 shadow-rose-900/10
        {% elif message.tags == 'success' %}bg-emerald-50/95 text-emerald-900 border-emerald-200 shadow-emerald-900/10
        {% elif message.tags == 'warning' %}bg-amber-50/95 text-amber-900 border-amber-200 shadow-amber-900/10
        {% else %}bg-white/95 text-slate-800 border-slate-200/90 shadow-slate-900/15{% endif %}"
        x-data="{ show: true }" 
        x-init="setTimeout(() => show = false, 6000)"
        x-cloak 
        x-show="show" 
        x-transition:enter="transition ease-out duration-300 transform"
        x-transition:enter-start="opacity-0 translate-y-[-12px] scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200 transform"
        x-transition:leave-start="opacity-100 translate-y-0 scale-100"
        x-transition:leave-end="opacity-0 translate-y-[-10px] scale-95">
        
        <div class="flex items-center space-x-2.5 mr-2">
            <div class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0
                {% if message.tags == 'error' %}bg-rose-100 text-rose-600
                {% elif message.tags == 'success' %}bg-emerald-100 text-emerald-600
                {% elif message.tags == 'warning' %}bg-amber-100 text-amber-600
                {% else %}bg-blue-50 text-[#002D62]{% endif %}">
                {% if message.tags == 'error' %}<i data-lucide="alert-circle" class="w-4 h-4"></i>
                {% elif message.tags == 'success' %}<i data-lucide="check-circle-2" class="w-4 h-4"></i>
                {% elif message.tags == 'warning' %}<i data-lucide="alert-triangle" class="w-4 h-4"></i>
                {% else %}<i data-lucide="info" class="w-4 h-4"></i>{% endif %}
            </div>
            <span class="leading-snug text-xs sm:text-[13px] font-semibold">{{ message }}</span>
        </div>

        <button @click="show = false" 
                class="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition cursor-pointer shrink-0"
                title="Dismiss">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
