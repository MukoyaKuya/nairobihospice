{% extends 'base.html' %}

{% block title %}Record Encounter - Nairobi Hospice PCMS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div>
        <a href="{% url 'patients:patient_detail' patient.pk %}" class="text-xs font-semibold text-teal-600 hover:text-teal-700 flex items-center mb-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1"></i> Back to Patient
        </a>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Record Clinical Encounter / Visit</h1>
        <p class="text-xs text-slate-500 mt-0.5">Patient: <strong>{{ patient.full_name }}</strong> ({{ patient.hospice_number }})</p>
    </div>

    <form method="POST" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
        {% csrf_token %}

        <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Encounter Type *</label>
                    {{ form.encounter_type }}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Encounter Date *</label>
                    <input type="date" name="encounter_date" value="{{ form.encounter_date.value|date:'Y-m-d'|default:'' }}" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Location *</label>
                    <input type="text" name="location" value="{{ form.location.value|default:'Nairobi Hospice Clinic' }}" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Reason for Encounter *</label>
                    <input type="text" name="reason" placeholder="e.g. Pain breakthrough review, wound care, psychosocial check" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Clinical Progress Notes (SOAP / Narrative) *</label>
                <textarea name="clinical_notes" required rows="5" placeholder="Subjective complaints, physical examination, assessment synthesis, discussion with patient/caregiver..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Interventions & Procedures Performed</label>
                <textarea name="interventions_performed" rows="3" placeholder="Morphine titration, wound dressing, family counselling, nutritional advice..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Next Follow-up Date</label>
                    <input type="date" name="next_followup_date" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Next Follow-up Plan</label>
                    <input type="text" name="next_followup_plan" placeholder="e.g. Home visit in 2 weeks to assess bowel function" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-6 border-t border-slate-100">
            <a href="{% url 'patients:patient_detail' patient.pk %}" class="px-5 py-2.5 text-xs font-bold text-slate-600">Cancel</a>
            <button type="submit" class="px-6 py-2.5 text-xs font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-xl shadow-md transition">
                Save Encounter Record
            </button>
        </div>
    </form>
</div>
{% endblock %}
