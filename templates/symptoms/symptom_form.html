{% extends 'base.html' %}

{% block title %}Record ESAS Symptoms - Nairobi Hospice PCMS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div>
        <a href="{% url 'patients:patient_detail' patient.pk %}" class="text-xs font-semibold text-teal-600 hover:text-teal-700 flex items-center mb-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1"></i> Back to Patient
        </a>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Edmonton Symptom Assessment (ESAS)</h1>
        <p class="text-xs text-slate-500 mt-0.5">Rate each symptom from <strong>0 (No symptom)</strong> to <strong>10 (Worst possible)</strong>.</p>
    </div>

    <form method="POST" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
        {% csrf_token %}

        <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-rose-800 mb-1">Pain (0 - 10)</label>
                    <input type="number" name="pain" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-amber-800 mb-1">Tiredness / Fatigue (0 - 10)</label>
                    <input type="number" name="tiredness" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-slate-800 mb-1">Drowsiness (0 - 10)</label>
                    <input type="number" name="drowsiness" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-emerald-800 mb-1">Nausea (0 - 10)</label>
                    <input type="number" name="nausea" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-slate-800 mb-1">Lack of Appetite (0 - 10)</label>
                    <input type="number" name="appetite" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-sky-800 mb-1">Shortness of Breath (0 - 10)</label>
                    <input type="number" name="breathlessness" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-indigo-800 mb-1">Depression / Sadness (0 - 10)</label>
                    <input type="number" name="depression" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-purple-800 mb-1">Anxiety / Nervousness (0 - 10)</label>
                    <input type="number" name="anxiety" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-teal-800 mb-1">Overall Feeling of Wellbeing (0 Best - 10 Worst)</label>
                    <input type="number" name="wellbeing" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
                <div class="p-3 bg-slate-50 rounded-xl">
                    <label class="block font-bold text-slate-800 mb-1">Constipation (0 - 10)</label>
                    <input type="number" name="constipation" min="0" max="10" value="0" class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Clinical Notes on Symptoms / Triggers</label>
                <textarea name="clinical_notes" rows="3" placeholder="Symptom triggers, relief from medications, patient comments..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-6 border-t border-slate-100">
            <a href="{% url 'patients:patient_detail' patient.pk %}" class="px-5 py-2.5 text-xs font-bold text-slate-600">Cancel</a>
            <button type="submit" class="px-6 py-2.5 text-xs font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-xl shadow-md transition">
                Save ESAS Scores
            </button>
        </div>
    </form>
</div>
{% endblock %}
