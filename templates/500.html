{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Nairobi Hospice PCMS</title>
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="error-page">
    <a href="#main" class="skip-link">Skip to content</a>
    <main id="main" class="error-card">
        <img src="{% static 'images/logo.png' %}" alt="Nairobi Hospice" class="error-logo">
        <p class="error-kicker">HTTP 500</p>
        <h1>System Encountered An Error</h1>
        <p>An unexpected technical error occurred while processing this request.</p>
        <p class="error-actions">
            <a href="/">Return to Home</a>
        </p>
        <p class="error-meta">Urgent technical support: +254 722 200 413</p>
    </main>
</body>
</html>
