{% extends 'base.html' %}
{% block title %}Choose New Password - Nairobi Hospice PCMS{% endblock %}
{% block content %}<div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6">{% if validlink %}<h1 class="text-xl font-black text-slate-900">Choose a new password</h1><form method="post" class="space-y-3 mt-4">{% csrf_token %}{{ form.as_p }}<button class="w-full rounded-xl bg-[#002D62] text-white px-4 py-2.5 font-bold">Save password</button></form>{% else %}<p class="text-sm text-red-700">This reset link is invalid or expired.</p>{% endif %}</div>{% endblock %}
