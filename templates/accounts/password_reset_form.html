{% extends 'base.html' %}
{% block title %}Reset Password - Nairobi Hospice PCMS{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
    <h1 class="text-xl font-black text-slate-900">Reset your password</h1>
    <p class="text-sm text-slate-600">Enter your staff email address. If it is registered, a reset link will be sent.</p>
    <form method="post" class="space-y-3">{% csrf_token %}{{ form.email }}<button class="w-full rounded-xl bg-[#002D62] text-white px-4 py-2.5 font-bold">Send reset link</button></form>
</div>
{% endblock %}
