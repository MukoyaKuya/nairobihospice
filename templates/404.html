{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nairobi Hospice PCMS</title>
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="error-page">
    <a href="#main" class="skip-link">Skip to content</a>
    <main id="main" class="error-card">
        <img src="{% static 'images/logo.png' %}" alt="Nairobi Hospice" class="error-logo">
        <p class="error-kicker">HTTP 404</p>
        <h1>Page Not Found</h1>
        <p>The requested URL or clinical resource does not exist on this server.</p>
        <p class="error-actions">
            <a href="/">Return to Home</a>
            <a href="{% url 'patients:patient_list' %}">Patient Directory</a>
        </p>
        <p class="error-meta">Nairobi Hospice Helpdesk: +254 722 200 413</p>
    </main>
</body>
</html>
