<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Outer Frame -->
  <rect width="600" height="600" fill="#000000"/>
  <!-- Nairobi Hospice Iconic Intertwined Knot in crisp white lines -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center woven square -->
    <rect x="210" y="210" width="180" height="180" rx="10" transform="rotate(45 300 300)"/>
    <rect x="225" y="225" width="150" height="150" rx="6" transform="rotate(45 300 300)"/>
    <rect x="240" y="240" width="120" height="120" rx="4" transform="rotate(45 300 300)"/>

    <!-- Top Loop -->
    <path d="M 210 210 C 210 90, 390 90, 390 210"/>
    <path d="M 225 210 C 225 110, 375 110, 375 210"/>
    <path d="M 240 210 C 240 130, 360 130, 360 210"/>

    <!-- Bottom Loop -->
    <path d="M 210 390 C 210 510, 390 510, 390 390"/>
    <path d="M 225 390 C 225 490, 375 490, 375 390"/>
    <path d="M 240 390 C 240 470, 360 470, 360 390"/>

    <!-- Left Loop -->
    <path d="M 210 210 C 90 210, 90 390, 210 390"/>
    <path d="M 210 225 C 110 225, 110 375, 210 375"/>
    <path d="M 210 240 C 130 240, 130 360, 210 360"/>

    <!-- Right Loop -->
    <path d="M 390 210 C 510 210, 510 390, 390 390"/>
    <path d="M 390 225 C 490 225, 490 375, 390 375"/>
    <path d="M 390 240 C 470 240, 470 360, 390 360"/>

    <!-- Diagonal interconnects -->
    <line x1="165" y1="165" x2="435" y2="435"/>
    <line x1="435" y1="165" x2="165" y2="435"/>
    <line x1="180" y1="180" x2="420" y2="420"/>
    <line x1="420" y1="180" x2="180" y2="420"/>
  </g>
</svg>
