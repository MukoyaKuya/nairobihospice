name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Access sync scripts must not run in deploy jobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          scripts = (
              "sync_access_data.py",
              "sync_clinical_and_supply_data.py",
              "sync_complete_access_master.py",
          )
          failed = False
          root = Path(".github/workflows")
          files = list(root.glob("*.yml")) + list(root.glob("*.yaml"))
          for wf in files:
              current_job = ""
              in_jobs = False
              for i, line in enumerate(wf.read_text(encoding="utf-8").splitlines(), 1):
                  if line.startswith("jobs:"):
                      in_jobs = True
                      continue
                  if in_jobs and re.match(r"  [A-Za-z0-9_-]+:\s*$", line):
                      current_job = line.strip().rstrip(":")
                  if any(script in line for script in scripts):
                      hay = f"{current_job} {line}".lower()
                      if "deploy" in hay:
                          print(f"{wf}:{i}: Access sync script referenced in deploy job '{current_job}'")
                          failed = True
          if failed:
              sys.exit(1)
          PY
      - name: Compile Python
        run: python -m compileall -q apps api config tests
      - name: Ruff
        run: ruff check .
      - name: Django checks
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=apps --cov=api --cov-report=term-missing --cov-fail-under=75
      - name: Dependency audit
        run: python -m pip install pip-audit && pip-audit
