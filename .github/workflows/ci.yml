name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q apps api config tests
      - name: Lint (ruff)
        run: ruff check .
      - name: Django system checks
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite (coverage gate 75%)
        run: pytest --cov=apps --cov=api --cov-report=term-missing --cov-fail-under=75
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit --skip-editable
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/openapi.yml --validate

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-for-anything-real
      PCMS_E2E_BASE_URL: http://127.0.0.1:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Prepare database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_hospice_data --no-color > /tmp/seed_output.txt
          grep -E '^[^:]+: ' /tmp/seed_output.txt | head -1 || true
      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Run application
        run: nohup python manage.py runserver 127.0.0.1:8010 --noreload > /tmp/server.log 2>&1 &
      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/health/live/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8010/health/live/
      - name: Run E2E tests
        run: cd e2e && npx playwright test
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/server.log
