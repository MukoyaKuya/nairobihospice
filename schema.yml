components:
  schemas:
    AppointmentSummary:
      type: object
      description: Reception-safe scheduling representation without clinical reasons
        or outcomes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_name:
          type: string
          readOnly: true
        staff_member:
          type: string
          format: uuid
        staff_name:
          type: string
          readOnly: true
        appointment_type:
          $ref: '#/components/schemas/AppointmentTypeEnum'
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        location:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/AppointmentSummaryStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - patient
      - patient_name
      - scheduled_date
      - staff_member
      - staff_name
      - updated_at
    AppointmentSummaryStatusEnum:
      enum:
      - SCHEDULED
      - CONFIRMED
      - COMPLETED
      - CANCELLED
      - MISSED
      - RESCHEDULED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `CONFIRMED` - Confirmed
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `MISSED` - Missed / Did Not Attend (DNA)
        * `RESCHEDULED` - Rescheduled
    AppointmentTypeEnum:
      enum:
      - CLINIC_VISIT
      - HOME_VISIT
      - TELEPHONE
      - MDT_MEETING
      - COUNSELLING
      - DAY_CARE
      type: string
      description: |-
        * `CLINIC_VISIT` - Hospice Clinic Consultation
        * `HOME_VISIT` - Home Care Visit
        * `TELEPHONE` - Telephone Review
        * `MDT_MEETING` - Multidisciplinary Team Case Review
        * `COUNSELLING` - Psychosocial / Bereavement Session
        * `DAY_CARE` - Day Care Activity
    Assessment:
      type: object
      description: Prevent API writes from moving a record across patient access boundaries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        assessment_date:
          type: string
          format: date
        pain_score:
          type: integer
          maximum: 10
          minimum: 0
          nullable: true
          description: Numeric Rating Scale 0-10
        pain_site:
          type: string
          readOnly: true
          nullable: true
        pain_character:
          type: string
          readOnly: true
          nullable: true
        pps_score:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Palliative Performance Scale % (0-100)
        ecog_score:
          type: integer
          maximum: 4
          minimum: 0
          nullable: true
          description: ECOG Performance Status (0-4)
        psychosocial_needs:
          type: string
          readOnly: true
          nullable: true
        spiritual_concerns:
          type: string
          readOnly: true
          nullable: true
        clinical_summary:
          type: string
          description: Clinician impressions, diagnosis synthesis, management plan
        assessor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        assessor_name:
          type: string
          readOnly: true
        next_review_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assessor
      - assessor_name
      - clinical_summary
      - created_at
      - id
      - pain_character
      - pain_site
      - patient
      - psychosocial_needs
      - spiritual_concerns
      - updated_at
    AssessmentTypeEnum:
      enum:
      - INITIAL
      - PAIN
      - FUNCTIONAL
      - PSYCHOSOCIAL
      - SPIRITUAL
      - NUTRITIONAL
      - CAREGIVER
      - FOLLOWUP
      type: string
      description: |-
        * `INITIAL` - Initial Holistic Palliative Assessment
        * `PAIN` - Comprehensive Pain Assessment (0-10 & Mapping)
        * `FUNCTIONAL` - Functional Assessment (PPS & ECOG)
        * `PSYCHOSOCIAL` - Psychosocial & Family Assessment
        * `SPIRITUAL` - Spiritual & Existential Assessment
        * `NUTRITIONAL` - Nutritional & Intake Assessment
        * `CAREGIVER` - Caregiver Burden & Needs Assessment
        * `FOLLOWUP` - Routine Clinical Follow-up Assessment
    CarePlan:
      type: object
      description: Prevent API writes from moving a record across patient access boundaries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        episode:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 200
        primary_diagnosis:
          type: string
          maxLength: 255
        overall_goals:
          type: string
          description: Patient-centred priorities and overarching goals of care
        resuscitation_preference:
          type: string
          description: Advance care directive preference
          maxLength: 100
        status:
          $ref: '#/components/schemas/CarePlanStatusEnum'
        review_date:
          type: string
          format: date
          nullable: true
          description: Next multidisciplinary review date
        needs:
          type: array
          items:
            $ref: '#/components/schemas/CarePlanNeed'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - needs
      - overall_goals
      - patient
      - updated_at
    CarePlanNeed:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        care_plan:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CategoryEnum'
        problem_description:
          type: string
          description: Identified issue or symptom
        goal:
          type: string
          description: Desired measurable or subjective outcome
        interventions:
          type: string
          description: Action steps and clinical interventions
        responsible_discipline:
          type: string
          maxLength: 100
        target_date:
          type: string
          format: date
          nullable: true
        is_resolved:
          type: boolean
        outcome_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - care_plan
      - created_at
      - goal
      - id
      - interventions
      - problem_description
    CarePlanStatusEnum:
      enum:
      - DRAFT
      - ACTIVE
      - UNDER_REVIEW
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `ACTIVE` - Active Care Plan
        * `UNDER_REVIEW` - Under Multidisciplinary Review
        * `COMPLETED` - Completed
        * `CANCELLED` - Discontinued / Cancelled
    CategoryEnum:
      enum:
      - PHYSICAL
      - PSYCHOSOCIAL
      - SPIRITUAL
      - PRACTICAL
      - ETHICAL
      type: string
      description: |-
        * `PHYSICAL` - Physical / Symptom Burden
        * `PSYCHOSOCIAL` - Psychosocial & Family
        * `SPIRITUAL` - Spiritual & Existential
        * `PRACTICAL` - Practical & Financial
        * `ETHICAL` - Advance Care Planning & Ethical
    Encounter:
      type: object
      description: Prevent API writes from moving a record across patient access boundaries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        episode:
          type: string
          format: uuid
          nullable: true
        encounter_type:
          $ref: '#/components/schemas/EncounterTypeEnum'
        encounter_date:
          type: string
          format: date
        location:
          type: string
          maxLength: 255
        reason:
          type: string
          description: Reason for encounter, e.g. Severe pain exacerbation, routine
            home check
          maxLength: 255
        clinical_notes:
          type: string
          description: Clinical summary / Progress notes (SOAP / Narrative)
        interventions_performed:
          type: string
          description: Procedures, med administration, wound dressing, education,
            counseling
        next_followup_date:
          type: string
          format: date
          nullable: true
        next_followup_plan:
          type: string
        recorded_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        recorded_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - clinical_notes
      - created_at
      - id
      - patient
      - reason
      - recorded_by
      - recorded_by_name
      - updated_at
    EncounterTypeEnum:
      enum:
      - CLINIC_VISIT
      - HOME_VISIT
      - TELEPHONE
      - COMMUNITY_VISIT
      - COUNSELLING
      - MDT_REVIEW
      - DAY_CARE
      - OTHER
      type: string
      description: |-
        * `CLINIC_VISIT` - Hospice Clinic Consultation
        * `HOME_VISIT` - Home Care Visit
        * `TELEPHONE` - Telephone Follow-up / Teleconsultation
        * `COMMUNITY_VISIT` - Community / Outreach Visit
        * `COUNSELLING` - Psychosocial / Bereavement Session
        * `MDT_REVIEW` - Multidisciplinary Team Case Review
        * `DAY_CARE` - Hospice Day Care Activity
        * `OTHER` - Other Encounter
    MaritalStatusEnum:
      enum:
      - SINGLE
      - MARRIED
      - WIDOWED
      - DIVORCED
      - SEPARATED
      - OTHER
      type: string
      description: |-
        * `SINGLE` - Single
        * `MARRIED` - Married
        * `WIDOWED` - Widowed
        * `DIVORCED` - Divorced
        * `SEPARATED` - Separated
        * `OTHER` - Other
    MedicationStatement:
      type: object
      description: Prevent API writes from moving a record across patient access boundaries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        medication_name:
          type: string
          description: Drug name and formulation, e.g. Oral Morphine Solution 5mg/5ml,
            Paracetamol, Lactulose
          maxLength: 200
        dosage:
          type: string
          description: e.g. 10 mg (10 ml)
          maxLength: 100
        route:
          $ref: '#/components/schemas/RouteEnum'
        frequency:
          type: string
          description: e.g. Every 4 hours (q4h) + Breakthrough dose PRN
          maxLength: 100
        indication:
          type: string
          description: e.g. Severe somatic and visceral cancer pain
          maxLength: 200
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/MedicationStatementStatusEnum'
        prescriber:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        prescriber_name:
          type: string
          readOnly: true
        instructions_for_caregiver:
          type: string
          description: Caregiver instructions in English/Swahili
        notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dosage
      - frequency
      - id
      - medication_name
      - notes
      - patient
      - prescriber
      - prescriber_name
      - updated_at
    MedicationStatementStatusEnum:
      enum:
      - ACTIVE
      - HELD
      - DISCONTINUED
      - COMPLETED
      type: string
      description: |-
        * `ACTIVE` - Active Medication
        * `HELD` - Temporarily Held / Paused
        * `DISCONTINUED` - Discontinued / Ceased
        * `COMPLETED` - Course Completed
    PaginatedAppointmentSummaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
