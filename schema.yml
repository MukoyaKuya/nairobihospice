openapi: 3.0.3
info:
  title: Nairobi Hospice PCMS API
  version: 1.0.0
  description: Clinical and Operational API for Nairobi Hospice Palliative Care Management
    System
paths:
  /api/v1/appointments/:
    get:
      operationId: v1_appointments_list
      parameters:
      - in: query
        name: appointment_type
        schema:
          type: string
          enum:
          - CLINIC_VISIT
          - COUNSELLING
          - DAY_CARE
          - HOME_VISIT
          - MDT_MEETING
          - TELEPHONE
        description: |-
          * `CLINIC_VISIT` - Hospice Clinic Consultation
          * `HOME_VISIT` - Home Care Visit
          * `TELEPHONE` - Telephone Review
          * `MDT_MEETING` - Multidisciplinary Team Case Review
          * `COUNSELLING` - Psychosocial / Bereavement Session
          * `DAY_CARE` - Day Care Activity
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
      - in: query
        name: scheduled_date
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: staff_member
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - CONFIRMED
          - MISSED
          - RESCHEDULED
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `CONFIRMED` - Confirmed
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
          * `MISSED` - Missed / Did Not Attend (DNA)
          * `RESCHEDULED` - Rescheduled
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentSummaryList'
          description: ''
    post:
      operationId: v1_appointments_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentSummary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentSummary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentSummary'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSummary'
          description: ''
  /api/v1/appointments/{id}/:
    get:
      operationId: v1_appointments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Appointment.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSummary'
          description: ''
    put:
      operationId: v1_appointments_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Appointment.
        required: true
