          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSummary'
          description: ''
    patch:
      operationId: v1_appointments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Appointment.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSummary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSummary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSummary'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSummary'
          description: ''
    delete:
      operationId: v1_appointments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Appointment.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assessments/:
    get:
      operationId: v1_assessments_list
      parameters:
      - in: query
        name: assessment_date
        schema:
          type: string
          format: date
      - in: query
        name: assessment_type
        schema:
          type: string
          enum:
          - CAREGIVER
          - FOLLOWUP
          - FUNCTIONAL
          - INITIAL
          - NUTRITIONAL
          - PAIN
          - PSYCHOSOCIAL
          - SPIRITUAL
        description: |-
          * `INITIAL` - Initial Holistic Palliative Assessment
          * `PAIN` - Comprehensive Pain Assessment (0-10 & Mapping)
          * `FUNCTIONAL` - Functional Assessment (PPS & ECOG)
          * `PSYCHOSOCIAL` - Psychosocial & Family Assessment
          * `SPIRITUAL` - Spiritual & Existential Assessment
          * `NUTRITIONAL` - Nutritional & Intake Assessment
          * `CAREGIVER` - Caregiver Burden & Needs Assessment
          * `FOLLOWUP` - Routine Clinical Follow-up Assessment
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
