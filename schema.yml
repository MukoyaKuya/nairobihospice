  /api/v1/patients/:
    get:
      operationId: v1_patients_list
      parameters:
      - in: query
        name: county
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sex
        schema:
          type: string
          enum:
          - F
          - M
          - O
          - U
        description: |-
          * `F` - Female
          * `M` - Male
          * `O` - Other
          * `U` - Unknown
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DECEASED
          - DISCHARGED
          - INACTIVE
        description: |-
          * `ACTIVE` - Active Care
          * `INACTIVE` - Inactive / On Hold
          * `DISCHARGED` - Discharged
          * `DECEASED` - Deceased
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
