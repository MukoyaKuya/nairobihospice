  /api/v1/medications/:
    get:
      operationId: v1_medications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
      - in: query
        name: route
        schema:
          type: string
          enum:
          - INHALED
          - INTRAVENOUS
          - ORAL
          - RECTAL
          - SUBCUTANEOUS
          - SUBLINGUAL
          - TOPICAL
          - TRANSDERMAL
        description: |-
          * `ORAL` - Oral (PO)
          * `SUBLINGUAL` - Sublingual (SL)
          * `SUBCUTANEOUS` - Subcutaneous (SC)
          * `INTRAVENOUS` - Intravenous (IV)
          * `TRANSDERMAL` - Transdermal Patch
          * `RECTAL` - Rectal (PR)
          * `TOPICAL` - Topical
          * `INHALED` - Inhalation / Nebulized
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - DISCONTINUED
          - HELD
        description: |-
          * `ACTIVE` - Active Medication
          * `HELD` - Temporarily Held / Paused
          * `DISCONTINUED` - Discontinued / Ceased
          * `COMPLETED` - Course Completed
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
